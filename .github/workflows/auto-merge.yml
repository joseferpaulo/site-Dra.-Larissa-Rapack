name: Auto Merge Jules PRs

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: startsWith(github.event.pull_request.title, 'Jules:')
    steps:
      - name: Aprovar e Mesclar PR Automaticamente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "${{ github.event.pull_request.html_url }}" || true
          gh pr merge --merge "${{ github.event.pull_request.html_url }}"
